name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish
        required: true
        type: string
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  macos:
    uses: ./.github/workflows/macos-sign.yml
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}
    secrets: inherit

  packages:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify release version
        run: test "$RELEASE_TAG" = "v$(dotnet msbuild C64UViewer.csproj -getProperty:Version)"
      - name: Build release packages
        run: bash build.sh
      - uses: actions/upload-artifact@v6
        with:
          name: release-packages
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [macos, packages]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prefix="c64uviewer_${RELEASE_TAG#v}_macos"
          test -f "release-assets/${prefix}_arm64.dmg"
          test -f "release-assets/${prefix}_x64.dmg"
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes release-assets/*
